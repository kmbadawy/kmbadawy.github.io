baseURL: "https://kmbadawy.github.io/"
languageCode: en-us
title: "Khaled's Blog"
theme: PaperMod

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: ""

minify:
  disableXML: true

params:
  env: production
  title: "Khaled's Blog"
  description: "A collection of wise first-principles tips."
  author: "Khaled"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  ShowToc: true
  TocOpen: false
  comments: false
  math: true

  homeInfoParams:
    Title: "Khaled's Blog"
    Content: |
      I'm currently a PhD candidate in Materials Science at Khalifa University, UAE,
      expected to graduate in December 2026. My research sits in condensed matter
      physics — electronic structure, topological phases of matter, strongly
      correlated electron systems, and magnetism — carried out mostly through
      first-principles calculations in VASP.

      Computational modeling can be overwhelming when you're starting out, and I
      remember that feeling well. Your advisor asks you to do a "literature
      review," and somehow you end up surfing the web just trying to get a single
      calculation to run, quietly convinced that your only job is to produce
      "results."

      Have you heard of GIGO — garbage in, garbage out? Every newcomer to
      computational research passes through a GIGO phase: the numbers come out,
      but the understanding behind them hasn't caught up yet. I hope this website
      helps shorten that phase for someone.

      I started writing here to share the research tricks and tips I run into
      along the way — the kind that aren't always written down anywhere, or that
      took me longer to figure out than they should have. Updates are irregular,
      because research is irregular. Expect the topics to jump around.

      For quick, bite-sized lessons, check the [Wise Tips](/wise-tips/) page.

  socialIcons:
    - name: github
      url: "https://github.com/kmbadawy"

  assets:
    disableHLJS: true
    favicon: "favicon.ico"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: wise-tips
      name: Wise Tips
      url: /wise-tips/
      weight: 25
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
        enable: true

taxonomies:
  tag: tags
  series: series
